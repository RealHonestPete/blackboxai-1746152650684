<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPY Price Prediction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
  <div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-4 text-center">SPY 10-Minute Price Prediction</h1>
    <div class="bg-white rounded shadow p-6 mb-6">
      <h2 class="text-xl font-semibold mb-2">Model Performance</h2>
      <p id="performance" class="text-gray-700">Loading performance...</p>
    </div>
    <div class="bg-white rounded shadow p-6 mb-6">
      <h2 class="text-xl font-semibold mb-2">Price Prediction</h2>
      <p id="prediction" class="text-2xl font-bold text-blue-600">Loading prediction...</p>
    </div>
    <div class="bg-white rounded shadow p-6">
      <h2 class="text-xl font-semibold mb-4">Price Chart</h2>
      <canvas id="priceChart" height="400"></canvas>
    </div>
  </div>

  <script>
    async function fetchPerformance() {
      const res = await fetch('/api/performance');
      const data = await res.json();
      document.getElementById('performance').textContent = `R2 Score: ${data.r2_score.toFixed(4)}`;
    }

    async function fetchPrediction() {
      const res = await fetch('/api/predict');
      const data = await res.json();
      if (data.predicted_price) {
        document.getElementById('prediction').textContent = `$${data.predicted_price.toFixed(2)}`;
      } else {
        document.getElementById('prediction').textContent = 'Error fetching prediction';
      }
    }

    async function fetchPriceData() {
      // For demo, fetch historical SPY data from server or use static data
      // Here, we will fetch the combined data CSV and parse it
      const res = await fetch('/combined_spy_treasury_data.csv');
      const text = await res.text();
      const lines = text.split('\\n').slice(1);
      const labels = [];
      const prices = [];
      for (const line of lines) {
        const cols = line.split(',');
        if (cols.length > 4) {
          labels.push(cols[0]);
          prices.push(parseFloat(cols[4]));
        }
      }
      return { labels, prices };
    }

    async function renderChart() {
      const ctx = document.getElementById('priceChart').getContext('2d');
      const data = await fetchPriceData();
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.labels,
          datasets: [{
            label: 'SPY Close Price',
            data: data.prices,
            borderColor: 'rgba(59, 130, 246, 1)',
            backgroundColor: 'rgba(59, 130, 246, 0.2)',
            fill: true,
            tension: 0.1,
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: {
              display: true,
              title: {
                display: true,
                text: 'Timestamp'
              }
            },
            y: {
              display: true,
              title: {
                display: true,
                text: 'Price ($)'
              }
            }
          }
        }
      });
    }

    fetchPerformance();
    fetchPrediction();
    renderChart();
  </script>
</body>
</html>
